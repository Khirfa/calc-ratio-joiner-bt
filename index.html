<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>RBT | By Khirfa</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --accent-color: #00f2ff;
            --text-primary: #ffffff;
            --text-secondary: #8a95ad;
            --input-bg: #090c12;
            --border-color: #242b3d;
            --warning-red: #ff4d4d;
            --color-inf: #4d94ff; 
            --color-lan: #ff4d4d; 
            --color-mm: #4dff88;  
        }

        body, input, select, button, table, div, span, b { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }

        body { background-color: var(--bg-color); color: var(--text-primary); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; position: relative; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-weight: 800; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; font-size: 1.1rem; margin: 0; text-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        
        .header-controls { display: flex; gap: 8px; align-items: center; }
        
        select.lang-select { background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border-color); padding: 5px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; outline: none; }
        
        .tips-icon { cursor: pointer; width: 30px; height: 30px; background: rgba(0, 242, 255, 0.1); border: 1px solid var(--accent-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-color); font-size: 1rem; transition: 0.3s; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--card-bg); margin: 10% auto; padding: 25px; border: 1px solid var(--accent-color); border-radius: 16px; width: 85%; max-width: 400px; color: var(--text-primary); position: relative; max-height: 80vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: var(--text-secondary); font-size: 24px; cursor: pointer; }

        .section-card { background: var(--card-bg); padding: 18px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        h2 { 
		font-size: 0.8rem; 
		text-transform: uppercase; 
		color: var(--text-secondary); 
		border-left: 3px solid var(--accent-color); 
		padding-left: 10px; 
		margin: 0 !important; /* Paksa margin jadi 0 */
		display: flex;
		align-items: center;
		}
        .input-wrapper { display: flex; flex-direction: column; gap: 12px; }
        label { display: block; font-size: 0.7rem; margin-bottom: 5px; color: var(--text-secondary); font-weight: 600; }
        
        /* Input diperbaiki untuk mobile */
        input { 
            width: 100%; 
            padding: 12px; 
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            color: white; 
            font-size: 1rem; 
            box-sizing: border-box; 
            outline: none; 
            -webkit-appearance: none; /* Menghapus style bawaan iOS */
        }
        
        /* Mencegah auto-zoom di iOS (font minimal 16px) */
        @media screen and (max-width: 768px) {
            input { font-size: 16px; }
        }

        input:focus { border-color: var(--accent-color); }

        .result-container { background: linear-gradient(145deg, #161b26, #0d1117); padding: 20px; border-radius: 16px; border: 1px solid rgba(0, 242, 255, 0.4); margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.75rem; }
        th { background-color: #1f2636; padding: 10px 5px; text-align: center; color: var(--text-primary); font-weight: 800; text-transform: uppercase; }
        .th-inf { color: var(--color-inf) !important; } 
        .th-lan { color: var(--color-lan) !important; } 
        .th-mm { color: var(--color-mm) !important; }
        td { background-color: rgba(255,255,255,0.02); padding: 12px 5px; text-align: center; border-top: 1px solid var(--border-color); color: var(--text-primary); font-weight: 500; }
        
        .capacity-info { font-size: 0.75rem; color: var(--text-secondary); margin-top: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #242b3d; padding-bottom: 5px; }
        .val-highlight { color: var(--accent-color); font-weight: 700; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; }
        .btn-reset { background: #333; color: white; }
        .btn-save { background: var(--accent-color); color: #000; }
        
        .calc-detail { background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px dashed var(--border-color); }
        .calc-line { display: flex; justify-content: space-between; font-size: 0.7rem; margin-bottom: 4px; }
        .calc-total { border-top: 1px solid var(--text-secondary); margin-top: 5px; padding-top: 5px; font-weight: bold; color: var(--accent-color); }
        .error-msg { color: var(--warning-red); text-align: center; font-size: 0.75rem; font-weight: bold; padding: 10px; border: 1px dashed var(--warning-red); border-radius: 8px; }
        
        .watermark { text-align: center; font-size: 0.65rem; color: var(--text-secondary); margin-top: 30px; opacity: 0.8; letter-spacing: 1px; }
        .author-name { color: var(--accent-color); text-shadow: 0 0 8px rgba(0, 242, 255, 0.4); cursor: pointer; position: relative; transition: 0.3s; display: inline-block; -webkit-tap-highlight-color: transparent; }
        
        .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #000; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: none; z-index: 1000; box-shadow: 0 4px 12px rgba(0, 242, 255, 0.4); }
        .rtl { direction: rtl; text-align: right; }
		
		/* Tombol ? Kecil */
		.info-trigger {
			width: 20px;
			height: 20px;
			background: rgba(0, 242, 255, 0.1);
			border: 1.5px solid var(--accent-color);
			border-radius: 50%; /* Membuat jadi lingkaran sempurna */
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--accent-color);
			font-size: 0.75rem;
			cursor: pointer;
			transition: all 0.3s ease;
			font-weight: 800;
			-webkit-tap-highlight-color: transparent;
			box-shadow: 0 0 5px rgba(0, 242, 255, 0.2); /* Efek glow halus */
		}

		.info-trigger:hover {
			background: var(--accent-color);
			color: #000;
			box-shadow: 0 0 12px var(--accent-color);
			transform: scale(1.1); /* Sedikit membesar saat disentuh */
		}
		
		/* Styling Modal Gambar (2 Gambar) */
		.image-modal-content {
			background-color: var(--card-bg);
			margin: 5% auto; /* Jarak atas lebih kecil agar muat 2 gambar */
			padding: 15px;
			border: 2px solid var(--accent-color);
			border-radius: 16px;
			width: 90%;
			max-width: 450px; /* Sedikit lebih lebar */
			max-height: 90vh; /* Agar tidak melebihi layar */
			overflow-y: auto; /* Scroll jika gambar terlalu panjang */
			position: relative;
			box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
		}

		.image-container {
			display: flex;
			flex-direction: column; /* Gambar atas-bawah */
			gap: 15px; /* Jarak antar gambar */
			margin-top: 15px;
		}

		.image-container img {
	    width: 100%;
	    height: auto;
	    border-radius: 8px;
	    margin-bottom: 5px; /* Jarak antar gambar jika ada 2 */
		}
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header-area">
        <h1 id="appTitle">RATIO BEAR TRAP</h1>
        <div class="header-controls">
            <select class="lang-select" id="langSelect" onchange="changeLang()">
                <option value="id">Bahasa Indonesia</option>
                <option value="en">English</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="ko">한국어 (Korean)</option>
                <option value="pl">Polski (Polish)</option>
                <option value="tr">Türkçe (Turkish)</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="de">Deutsch (German)</option>
                <option value="pt">Português (Brazil)</option>
            </select>
            <div class="tips-icon" onclick="toggleModal()">?</div>
        </div>
    </div>

    <div id="tipsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleModal()">&times;</span>
            <h2 id="modalTitle">❓ Panduan Penggunaan</h2>
            <div id="modalBody" style="font-size:0.8rem; line-height:1.6; color:var(--text-secondary);"></div>
        </div>
    </div>

	<div class="section-card">
		<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
			<h2 id="titlePasukan" style="margin-bottom: 0;">Data Pasukan Total</h2>
			<div class="info-trigger" onclick="openImageModal('pasukan')">?</div>
		</div>
		<div class="input-wrapper">
			<div class="input-group"><label id="labelInf">Total INFANTRY</label><input type="text" id="infantry" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="handleInput(this)"></div>
			<div class="input-group"><label id="labelLan">Total LANCER</label><input type="text" id="lancer" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="handleInput(this)"></div>
			<div class="input-group"><label id="labelMar">Total MARKSMAN</label><input type="text" id="marksman" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="handleInput(this)"></div>
		</div>
	</div>
	
	<div class="section-card">
		<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
			<h2 id="titleKaps" style="margin-bottom: 0;">Kapasitas & Barisan</h2>
			<div class="info-trigger" onclick="openImageModal('kapasitas')">?</div>
		</div>
		<div class="input-wrapper">
			<div class="input-group"><label id="labelKapsH">Kaps. HERO (Base)</label><input type="text" id="kapasitasHero" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="handleInput(this)"></div>
			<div class="input-group"><label id="labelKapsNH">Kaps. TANPA HERO (Base)</label><input type="text" id="kapasitasNoHero" inputmode="numeric" pattern="[0-9]*" placeholder="0" oninput="handleInput(this)"></div>
			<div class="input-group"><label id="labelBaris">Jumlah Barisan (Max 6)</label><input type="text" id="barisan" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="" oninput="handleInput(this, 6)"></div>
		</div>
	</div>

	<div class="section-card">
		<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
			<h2 id="titleSkill" style="margin-bottom: 0;">Level Skill Bonus</h2>
			<div class="info-trigger" onclick="openImageModal('skill')">?</div>
		</div>
		<div class="input-wrapper" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
			<div class="input-group"><label id="labelKera">Lv. Kera (0-10)</label><input type="text" id="kera" inputmode="numeric" pattern="[0-9]*" value="0" oninput="handleInput(this, 10)"></div>
			<div class="input-group"><label id="labelCyrille">Lv. Cyrille (0-10)</label><input type="text" id="cyrille" inputmode="numeric" pattern="[0-9]*" value="0" oninput="handleInput(this, 10)"></div>
		</div>
		<div class="input-group" style="grid-column: span 2; margin-top: 10px;">
			<label id="labelCityBuff">Buff Kota (Expansion)</label>
			<select id="cityBuff" onchange="hitung()" style="width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 1rem; outline: none;">
				<option value="0">Tanpa Buff</option>
				<option value="0.1">Kapasitas (10%)</option>
				<option value="0.2">Kapasitas (20%)</option>
			</select>
		</div>
	</div>

    <div class="section-card">
        <h2 id="titleRasioOpen">Rasio Open Rally (%)</h2>
        <div style="text-align: right; font-size: 0.65rem; color: var(--text-secondary); margin-bottom: 5px;"><span id="txtTotal">Total</span>: <span id="totalRasioDisp">0</span>% / Max 100%</div>
        <div class="input-wrapper" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <div class="input-group"><label style="color:var(--color-inf)">INF %</label><input type="text" id="rInf" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="" oninput="handleInput(this, 100)"></div>
            <div class="input-group"><label style="color:var(--color-lan)">LAN %</label><input type="text" id="rLan" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="" oninput="handleInput(this, 100)"></div>
            <div class="input-group"><label style="color:var(--color-mm)">MM %</label><input type="text" id="rMar" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="" oninput="handleInput(this, 100)"></div>
        </div>
    </div>
	
	<div id="imageModal" class="modal" onclick="closeImageModal()">
		<div class="modal-content image-modal-content">
			<span class="close-btn" onclick="closeImageModal()">&times;</span>
			<div class="image-container">
				<img src="" id="popupImg1" alt="Tutorial Gambar 1">
				<img src="" id="popupImg2" alt="Tutorial Gambar 2">
			</div>
		</div>
	</div>

    <div class="btn-group">
        <button class="btn-reset" onclick="resetData()" id="btnReset">Reset</button>
        <button class="btn-save" onclick="saveData()" id="btnSave">Save Data</button>
    </div>

    <div class="result-container" id="hasil"></div>

    <div class="watermark">Created by <b class="author-name" ondblclick="copyID()">Khirfa</b></div>
</div>

<div id="copyToast" class="copy-toast">UID 165313484 copied!</div>

function copyID() {
    const idText = "165313484";
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(idText).then(() => { showToast(); });
    } else {
        let textArea = document.createElement("textarea");
        textArea.value = idText;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast();
    }
}

function showToast() {
    const toast = document.getElementById("copyToast");
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2000);
}

function changeLang() {
    currentLang = document.getElementById('langSelect').value;
    const container = document.getElementById('mainContainer');
    if (currentLang === 'ar') container.classList.add('rtl');
    else container.classList.remove('rtl');
    updateUI();
}

function updateUI() {
    const t = i18n[currentLang] || i18n['en'];
    document.getElementById('modalTitle').innerText = t.modalTitle;
    document.getElementById('modalBody').innerHTML = t.modalBody;
    document.getElementById('titlePasukan').innerText = t.titlePasukan;
    document.getElementById('titleKaps').innerText = t.titleKaps;
    document.getElementById('titleRasioOpen').innerText = t.titleRasioOpen;
    document.getElementById('labelInf').innerText = t.labelInf;
    document.getElementById('labelLan').innerText = t.labelLan;
    document.getElementById('labelMar').innerText = t.labelMar;
    document.getElementById('labelKapsH').innerText = t.labelKapsH;
    document.getElementById('labelKapsNH').innerText = t.labelKapsNH;
    document.getElementById('labelBaris').innerText = t.labelBaris;
    document.getElementById('labelKera').innerText = t.labelKera;
    document.getElementById('labelCyrille').innerText = t.labelCyrille;
    
    if(document.getElementById('labelCityBuff')) document.getElementById('labelCityBuff').innerText = t.labelCityBuff;
    const cbSelect = document.getElementById('cityBuff');
    if(cbSelect) {
        cbSelect.options[0].text = t.optNoBuff;
        cbSelect.options[1].text = t.optBuff10;
        cbSelect.options[2].text = t.optBuff20;
    }

    document.getElementById('btnReset').innerText = t.btnReset;
    document.getElementById('btnSave').innerText = t.btnSave;
    document.getElementById('txtTotal').innerText = t.txtTotal;
    hitung();
}

function toggleModal() {
    const modal = document.getElementById("tipsModal");
    modal.style.display = (modal.style.display === "block") ? "none" : "block";
}

function handleInput(el, maxVal = null) {
    let cursor = el.selectionStart;
    let oldLen = el.value.length;
    let raw = el.value.replace(/\D/g, '');
    if (maxVal !== null && raw !== "") {
        if (parseInt(raw) > maxVal) raw = maxVal.toString();
    }
    el.value = (raw !== "") ? Number(raw).toLocaleString('id-ID') : "";
    let newLen = el.value.length;
    el.setSelectionRange(cursor + (newLen - oldLen), cursor + (newLen - oldLen));
    hitung();
}

function getVal(id) {
    let el = document.getElementById(id);
    if(!el) return 0;
    let val = el.value.replace(/\./g, '');
    return parseInt(val) || 0;
}

function resetData() {
    document.querySelectorAll('input').forEach(i => {
        if(['kera','cyrille','rInf','rLan','rMar'].includes(i.id)) {
            i.value = "0";
        } else {
            i.value = ""; 
        }
    });
    const cb = document.getElementById('cityBuff');
    if(cb) cb.value = "0";
    hitung();
}

function saveData() {
    if (!lastSaveText) return;
    navigator.clipboard.writeText(lastSaveText).then(() => {
        alert(i18n[currentLang].copySuccess);
    });
}

const imageSources = {
    'pasukan': { img1: 'Data_pasukan.jpeg', img2: '' },
    'kapasitas': { img1: 'Kaps_barisan_nohero.jpeg', img2: 'Kaps_barisan_hero.jpeg' },
    'skill': { img1: 'Skill_pet.jpeg', img2: 'Skill_cyrille.jpeg' }
};

function openImageModal(type) {
    const modal = document.getElementById('imageModal');
    const img1 = document.getElementById('popupImg1');
    const img2 = document.getElementById('popupImg2');
    const sources = imageSources[type];
    if (sources) {
        img1.src = sources.img1 || '';
        img1.style.display = sources.img1 ? 'block' : 'none';
        img2.src = sources.img2 || '';
        img2.style.display = sources.img2 ? 'block' : 'none';
        modal.style.display = 'block';
    }
}

function closeImageModal() {
    document.getElementById('imageModal').style.display = 'none';
}

window.onclick = function(event) {
    const tipsModal = document.getElementById("tipsModal");
    const imageModal = document.getElementById("imageModal");
    if (event.target == tipsModal) tipsModal.style.display = "none";
    if (event.target == imageModal) closeImageModal();
}

function hitung() {
    const t = i18n[currentLang] || i18n['en'];
    const sKera = {1:1500,2:3000,3:4500,4:6000,5:7500,6:9000,7:10500,8:12000,9:13500,10:15000};
    const sCyrille = {1:3000,2:6000,3:9000,4:12000,5:15000,6:18000,7:21000,8:24000,9:27000,10:30000};

    let lvK = getVal("kera"), lvC = getVal("cyrille");
    let infT = getVal("infantry"), lanT = getVal("lancer"), mmT = getVal("marksman");
    let kHBase = getVal("kapasitasHero"), kNHBase = getVal("kapasitasNoHero");
    let barisan = Math.max(1, getVal("barisan"));
    
    let cbSelect = document.getElementById("cityBuff");
    let cBuff = cbSelect ? parseFloat(cbSelect.value) : 0;

    let vrI = getVal("rInf"), vrL = getVal("rLan"), vrM = getVal("rMar");
    let totalRasio = vrI + vrL + vrM;
    document.getElementById("totalRasioDisp").innerText = totalRasio;
    document.getElementById("totalRasioDisp").style.color = (totalRasio <= 100) ? "var(--color-mm)" : "var(--warning-red)";

    if (totalRasio > 100) {
        document.getElementById("hasil").innerHTML = `<div class="error-msg">${t.errRasio} (${totalRasio}%)</div>`;
        lastSaveText = "";
        return;
    }

    let rI = vrI / 100, rL = vrL / 100, rM = vrM / 100;
    let bKera = sKera[lvK] || 0, bCyrille = sCyrille[lvC] || 0;
    
    let capRealH = Math.floor((kHBase + bKera + bCyrille) * (1 + cBuff));
    let capRealNH = Math.floor((kNHBase + bKera + bCyrille) * (1 + cBuff));

    let sI_total = Math.max(0, infT - (capRealH * rI));
    let sL_total = Math.max(0, lanT - (capRealH * rL));
    let sM_total = Math.max(0, mmT - (capRealH * rM));

    let pI = Math.floor(sI_total / barisan), pL = Math.floor(sL_total / barisan), pM = Math.floor(sM_total / barisan);

    function getRangeStr(unit, cap) {
        if (cap <= 0) return "0%";
        let raw = (unit / cap) * 100;
        let down = Math.min(100, Math.floor(raw)), up = Math.min(100, Math.ceil(raw));
        return (down === up) ? `${down}%` : `${down}% - ${up}%`;
    }

    let rInfH = getRangeStr(pI, capRealH), rLanH = getRangeStr(pL, capRealH), rMarH = getRangeStr(pM, capRealH);
    let rInfNH = getRangeStr(pI, capRealNH), rLanNH = getRangeStr(pL, capRealNH), rMarNH = getRangeStr(pM, capRealNH);

    lastSaveText = `${t.resTitle}\n\n${t.withH}:\nRatio: ${rInfH}/${rLanH}/${rMarH}\nUnits: ${pI.toLocaleString()}/${pL.toLocaleString()}/${pM.toLocaleString()}\n\n${t.noH}:\nRatio: ${rInfNH}/${rLanNH}/${rMarNH}\nUnits: ${pI.toLocaleString()}/${pL.toLocaleString()}/${pM.toLocaleString()}`;

    document.getElementById("hasil").innerHTML = `
        <h2 style="border:none; text-align:center; color:white; margin-bottom:15px;">${t.resTitle}</h2>
        <p style="font-size:0.75rem; color:var(--accent-color); margin-bottom:8px; font-weight:700;">${t.resSisa}</p>
        <div class="capacity-info"><span>INFANTRY:</span> <span class="val-highlight">${Math.floor(sI_total).toLocaleString('id-ID')}</span></div>
        <div class="capacity-info"><span>LANCER:</span> <span class="val-highlight">${Math.floor(sL_total).toLocaleString('id-ID')}</span></div>
        <div class="capacity-info"><span>MARKSMAN:</span> <span class="val-highlight">${Math.floor(sM_total).toLocaleString('id-ID')}</span></div>

        <p style="font-size:0.75rem; color:var(--accent-color); margin: 20px 0 8px 0; font-weight:700;">${t.resRasio}</p>
        <table>
            <tr><th style="text-align:center;">${t.mode}</th><th class="th-inf">INF</th><th class="th-lan">LAN</th><th class="th-mm">MM</th></tr>
            <tr><td>${t.withH}</td><td>${rInfH}</td><td>${rLanH}</td><td>${rMarH}</td></tr>
            <tr><td>${t.noH}</td><td>${rInfNH}</td><td>${rLanNH}</td><td>${rMarNH}</td></tr>
        </table>

        <p style="font-size:0.75rem; color:var(--accent-color); margin: 20px 0 8px 0; font-weight:700;">${t.resUnit} (${(pI+pL+pM).toLocaleString('id-ID')})</p>
        <table>
            <tr><th style="text-align:center;">${t.type}</th><th class="th-inf">INF</th><th class="th-lan">LAN</th><th class="th-mm">MM</th></tr>
            <tr><td>${t.units}</td><td>${pI.toLocaleString('id-ID')}</td><td>${pL.toLocaleString('id-ID')}</td><td>${pM.toLocaleString('id-ID')}</td></tr>
        </table>

        <div style="margin-top:20px;">
            <p style="font-size:0.75rem; color:var(--accent-color); margin-bottom:8px; font-weight:700;">${t.resDetail}</p>
            <div class="calc-detail">
                <div style="color: var(--text-secondary); font-size: 0.7rem; margin-bottom: 8px; font-weight: bold;">[ ${t.withH} ]</div>
                <div class="calc-line"><span>Base + Hero:</span> <span>${kHBase.toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus Pet:</span> <span>+${(bKera).toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus Expert:</span> <span>+${(bCyrille).toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus City:</span> <span>+${Math.floor((kHBase + bKera + bCyrille) * cBuff).toLocaleString('id-ID')} (${cBuff*100}%)</span></div>
                <div class="calc-total calc-line"><span>Total Akhir:</span> <span>${capRealH.toLocaleString('id-ID')}</span></div>
            </div>
            <div class="calc-detail" style="margin-top: 10px;">
                <div style="color: var(--text-secondary); font-size: 0.7rem; margin-bottom: 8px; font-weight: bold;">[ ${t.noH} ]</div>
                <div class="calc-line"><span>Base:</span> <span>${kNHBase.toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus Pet:</span> <span>+${(bKera).toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus Expert:</span> <span>+${(bCyrille).toLocaleString('id-ID')}</span></div>
                <div class="calc-line"><span>Bonus City:</span> <span>+${Math.floor((kNHBase + bKera + bCyrille) * cBuff).toLocaleString('id-ID')} (${cBuff*100}%)</span></div>
                <div class="calc-total calc-line"><span>Total Akhir:</span> <span>${capRealNH.toLocaleString('id-ID')}</span></div>
            </div>
        </div>
    `;
}
